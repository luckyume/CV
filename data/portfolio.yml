  - Currently working as a Product Engineering professional at PT. Valortek Ratanika Utama, specializing in product testing, drone systems, hardware integration, electrical troubleshooting, and RESTful API development using Python and FastAPI. Experienced in integrating ESP32 microcontrollers, communication interfaces, and hardware control systems, as well as conducting functional testing, preparing technical documentation, and providing user training.
