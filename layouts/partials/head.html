<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>{{ .Site.Title }}</title>

    <meta name="description" content="{{ .Site.Params.description }}" />
    <meta property="og:title" content="{{ .Site.Title }}" />
    <meta property="og:description" content="{{ .Site.Params.description }}" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="{{ .Permalink }}" />
    <meta name="theme-color" content="#1b4460" />

    {{ $script := resources.Get "js/index.js" | minify | fingerprint }}
    <script
        src="{{ $script.RelPermalink }}"
        integrity="{{ $script.Data.Integrity }}"
        crossorigin="anonymous"
        defer
    ></script>

    {{ $styles := resources.Get "css/output.css" | minify | fingerprint }}
    <link
        rel="stylesheet"
        href="{{ $styles.RelPermalink }}"
        integrity="{{ $styles.Data.Integrity }}"
        crossorigin="anonymous"
    />
    {{ $portfolioStyles := resources.Get "css/portfolio.css" | minify | fingerprint }}
    <link
        rel="stylesheet"
        href="{{ $portfolioStyles.RelPermalink }}"
        integrity="{{ $portfolioStyles.Data.Integrity }}"
        crossorigin="anonymous"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow+Condensed:wght@700;800;900&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
</head>
